services:
  user-service:
    build:
      context: ./userService
      dockerfile: Dockerfile.dev
    container_name: user-service
    volumes:
    - ./userService/target:/app/target
    - ./userService/src:/app/src
    - ~/.m2:/root/.m2
    restart: always
    ports:
    - "8081:8081"
    depends_on:
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
    - micro-net
    mem_limit: 600m
    cpus: "1.0"
    environment:
    - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx384m
    env_file: .env

  auth-service:
    build:
      context: ./authService
      dockerfile: Dockerfile.dev
    container_name: auth-service
    volumes:
    - ./authService/target:/app/target
    - ./authService/src:/app/src
    - ~/.m2:/root/.m2
    restart: always
    ports:
    - "8083:8083"
    depends_on:
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
    - micro-net
    mem_limit: 600m
    cpus: "1.0"
    environment:
    - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx384m
    env_file: .env

  mail-service:
    build:
      context: ./mailService
      dockerfile: Dockerfile.dev
    container_name: mail-service
    volumes:
    - ./mailService/target:/app/target
    - ./mailService/src:/app/src
    - ~/.m2:/root/.m2
    restart: always
    ports:
    - "8084:8084"
    depends_on:
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
    - micro-net
    mem_limit: 600m
    cpus: "1.0"
    environment:
    - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx384m
    env_file: .env

  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile.dev
    container_name: eureka
    restart: always
    ports:
    - "8761:8761"
    networks:
    - micro-net
    mem_limit: 700m
    cpus: "1.2"
    environment:
    - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  config-server:
    build:
      context: ./configServer
      dockerfile: Dockerfile.dev
    container_name: config-server
    restart: always
    ports:
    - "8888:8888"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
    - micro-net
    mem_limit: 300m
    cpus: "0.6"
    environment:
    - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms128m -Xmx200m

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.dev
    container_name: gateway
    restart: always
    ports:
    - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
    - micro-net
    mem_limit: 600m
    cpus: "1.0"
    environment:
    - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx384m

  db:
    image: postgres:15
    container_name: db
    restart: always
    ports:
    - "2500:5432"
    mem_limit: 800m
    cpus: "1.5"
    environment:
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - micro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    ports:
    - "2181:2181"
    mem_limit: 500m
    cpus: "0.6"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
    - zookeeper-data:/var/lib/zookeeper/data
    - zookeeper-logs:/var/lib/zookeeper/log
    networks:
    - micro-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    ports:
    - "19092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    mem_limit: 1.2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
    - kafka-data:/var/lib/kafka/data
    networks:
    - micro-net

networks:
  micro-net:


volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
