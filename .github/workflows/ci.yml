name: CI Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Detect which services changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            userService: 'userService/**'
            authService: 'authService/**'
            mailService: 'mailService/**'
            eureka: 'eureka/**'
            configServer: 'configServer/**'
            gateway: 'gateway/**'

  # Build services that changed
  build-services:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        run: mvn clean install -DskipTests
        working-directory: ./${{ matrix.service }}

  ci-complete:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-services]
    if: always() # This forces the job to run even if build-services is skipped!
    steps:
      - name: Check build status
        run: |
          # If changes were detected but the build failed
          if [[ "${{ needs.build-services.result }}" == "failure" || "${{ needs.build-services.result }}" == "cancelled" ]]; then
            echo "Build failed or was cancelled."
            exit 1
          fi
          
          # If everything passed or was safely skipped
          echo "All touched services built successfully (or no changes detected)."