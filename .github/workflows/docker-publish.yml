name: Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - "userService/**"
      - "authService/**"
      - "mailService/**"
      - "eureka/**"
      - "configServer/**"
      - "gateway/**"
      - ".github/workflows/docker-publish.yml"

jobs:
  # Detect which services changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      userService: ${{ steps.filter.outputs.userService }}
      authService: ${{ steps.filter.outputs.authService }}
      mailService: ${{ steps.filter.outputs.mailService }}
      eureka: ${{ steps.filter.outputs.eureka }}
      configServer: ${{ steps.filter.outputs.configServer }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            userService:
              - 'userService/**'
            authService:
              - 'authService/**'
            mailService:
              - 'mailService/**'
            eureka:
              - 'eureka/**'
            configServer:
              - 'configServer/**'
            gateway:
              - 'gateway/**'

  # Build userService
  build-userService:
    needs: detect-changes
    if: needs.detect-changes.outputs.userService == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push userService
        uses: docker/build-push-action@v4
        with:
          context: ./userService
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/user-service:latest

      - name: Scan userService image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/user-service:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  # Build authService
  build-authService:
    needs: detect-changes
    if: needs.detect-changes.outputs.authService == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push authService
        uses: docker/build-push-action@v4
        with:
          context: ./authService
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/auth-service:latest

      - name: Scan authService image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/auth-service:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  # Build mailService
  build-mailService:
    needs: detect-changes
